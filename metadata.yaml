name: astrbot_plugin_fish_home
display_name: 鱼的窝
short_desc: 鱼的窝：喂她吃点东西、攒好感度、收她写的信
desc: |
  一个像素房间，她在里面。整屏就是这间屋子，黑底、俯视、墙上有窗，窗外跟着你当地的天气变。

  左上角一块状态牌：她的名字、心情、好感度、余额、心愿、今天说了几句。底部是物品栏，8 种吃的各有自己的像素图标和吃东西动画，选中再点她，东西会飞到她嘴边。

  好感度是实时的：认真说话会涨，敷衍的"嗯哦"不算，凶她会掉。每天最多涨一点，会一直存着，也能掉成负数。
    ≥ 10  正常
     < 10  赌气，她停在赌气那一帧不动
     < 0   屋里没有人，只能靠聊天一点点聊回来

  她的状态每天折成一份工资进余额，余额花在吃的、DIY、加急信上。

  DIY：一句话描述你做了什么 + 自己填分数（−10 ~ +20），分数决定她的反应（惊喜 / 正常 / 中性 / 嫌弃 / 生气），她的口味表看过你爱放什么会做微调。一天一次。

  信箱：右上角「信」按钮，左边按月列、没读的带红点，右边是信纸。她一周最多写两封；花余额可以加急一封。

  「等你说完」：你连发几条，她只在你说完之后答最后一条（默认开，可在设置里关）。

  「离线补看」：你不在线时发的私聊，她上线后会翻出来看，下次说话能接上（需要 NapCat / aiocqhttp）。

  成就板：32 项分 6 类（喂食 / 陪伴 / 亲密与积累 / 小窝 / 好感与回赠 / 藏起来的东西），条件表在 assets/achievements.json，可以自己改名称、说明、条件和图标。

  「她送我的」：10 件一次性里程碑回礼，条件写在 assets/gifts_from_her.json，达成后右上角 🎁 亮红点，领取时有近景镜头。

  「她自己想的成就」：她根据你们之间真实发生过的事给自己立目标，条件她提、程序判；聊到第 31 天，她会多写一页不署名的东西。

  全量记忆：你的私聊原话按月存档（shadow 模式只存不读，省 token；改成 on 她就能想起来）。

  家具工坊（v0.2.0）：右上角「具」按钮。一句话描述想要什么，她的聊天模型出一份"施工图"（调色板 + 图元指令），代码把它渲染成真正的像素家具——平涂、自动 1px 深墨描边、透明背景，画风跟房间现有家具同规格。免费，不限次。摆放是纯拖动：从底部托盘按住拖进房间松手即落（松手在哪贴在哪、不吸附格子，上半挂墙下半落地，拖动时有落点虚影），**拖动中滚轮可调大小（0.4～3 倍，逐件记住）**，拖回托盘收回；解锁过的成就家具（食盆/地毯/观众牌）也能随便挪。自定义家具是纯装饰，点了没反应；素材和摆位存 plugin_data，整包升级不丢。

  家具工坊 · 精绘模式（v0.2.1，可选）：在设置里填一个兼容 OpenAI 接口（默认硅基流动）的生图 API Key，工坊就改用生图模型把这句话画出来，再本地抠图（四边洪水抠底色）、降采样、限到 8 色、自动描边，产出跟施工图完全同规格的像素家具——比纯图元更细腻，代价是每张慢十几秒、按张计费。Key 留空就是默认的 LLM 施工图模式，不填任何东西照常可用；精绘接口失败会自动退回施工图，不浪费这次生成。

  前置插件：astrbot_plugin_fish_heart（她的心情、九维、责难都从那里读）。
version: v0.2.2
author: zexuan604
repo: https://github.com/yuoo76910-sys/astrbot_plugin_fish_home
astrbot_version: ">=4.20"
support_platforms:
  - aiocqhttp
help: 后台插件列表点「页面」打开小窝：物品栏选吃的 → 点她喂食；点房间里的家具能互动；聊天里发 /奖励 看进度
